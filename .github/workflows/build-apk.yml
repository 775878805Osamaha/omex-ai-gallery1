name: Build OMEX AI Gallery1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build OMEX AI Gallery1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OMEX AI Gallery1
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build OMEX AI Gallery1 APK
        run: gradle assembleDebug

      - name: Upload OMEX AI Gallery1 APK
        uses: actions/upload-artifact@v4
        with:
          name: OMEX-AI-Gallery1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
