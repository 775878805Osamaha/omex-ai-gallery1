name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
      ANDROID_HOME: /home/runner/Android/Sdk
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:

      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. تجهيز Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 4. التحقق من Android SDK
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "Android SDK:"
          sdkmanager --version

          echo "Installed packages:"
          sdkmanager --list_installed

      # 5. تجهيز Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. التحقق من Gradle
      # مهم: نستخدم gradle وليس ./gradlew
      # لأن المستودع لا يحتوي على ملف gradlew
      - name: Verify Gradle
        run: |
          gradle --version

      # 7. تشغيل اختبارات الوحدة
      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --rerun-tasks --no-daemon

      # 8. بناء APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      # 9. التأكد من إنشاء APK
      - name: Verify APK Output
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 10. رفع APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEX-AI-Gallery1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
