name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test OMEX AI Gallery
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup JDK 21
      # ==========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ==========================================
      # 3. Verify Java
      # ==========================================
      - name: Verify Java
        run: |
          java -version
          javac -version

      # ==========================================
      # 4. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================
      # 5. Make Gradle Wrapper executable
      # ==========================================
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew

      # ==========================================
      # 6. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        run: |
          ./gradlew --version

      # ==========================================
      # 7. Verify Android SDK tools
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager not found in latest path."
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager was not found."
              exit 1
            fi

            echo "Found sdkmanager at:"
            echo "$SDKMANAGER"

            echo "SDKMANAGER_DIR=$(dirname "$SDKMANAGER")" >> "$GITHUB_ENV"
          else
            echo "SDKMANAGER_DIR=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_ENV"
          fi

      # ==========================================
      # 8. Install Android SDK 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -eux

          SDKMANAGER="$SDKMANAGER_DIR/sdkmanager"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # 9. Confirm Android API 36
      # ==========================================
      - name: Verify Android API 36
        shell: bash
        run: |
          set -eux

          echo "Checking Android 36..."

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo "Android 36 android.jar found."

          if [ -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Android Build Tools 36.0.0 found."
          else
            echo "ERROR: Build Tools 36.0.0 not found."
            exit 1
          fi

      # ==========================================
      # 10. Run Unit Tests
      # ==========================================
      - name: Run Unit Tests
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set -o pipefail

          ./gradlew \
            testDebugUnitTest \
            --no-daemon \
            --rerun-tasks \
            --stacktrace

      # ==========================================
      # 11. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 12. Verify APK
      # ==========================================
      - name: Verify APK Output
        shell: bash
        run: |
          set -eux

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      # ==========================================
      # 13. Upload APK
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEX-AI-Gallery-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
