name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test OMEX AI Gallery
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ runner.home }}/Android/Sdk
      ANDROID_HOME: ${{ runner.home }}/Android/Sdk

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JDK 21
      # Required by Robolectric for Android SDK 36
      # ==========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ==========================================
      # 3. Verify Java
      # ==========================================
      - name: Verify Java
        run: |
          java -version
          javac -version

      # ==========================================
      # 4. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================
      # 5. Verify Gradle Wrapper
      # ==========================================
      - name: Verify Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      # ==========================================
      # 6. Install Android SDK
      # Android API 36 required by compileSdk 36
      # ==========================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$HOME"

          TOOL_ZIP="commandlinetools-linux-9477386_latest.zip"

          wget -q \
            -O "$TOOL_ZIP" \
            "https://dl.google.com/android/repository/$TOOL_ZIP"

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          unzip -q "$TOOL_ZIP" -d "$ANDROID_SDK_ROOT/cmdline-tools/tmp"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/tmp/cmdline-tools/"* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/tmp"
          rm -f "$TOOL_ZIP"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # 7. Verify Android SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"

          echo "Android SDK 36 is installed correctly."

      # ==========================================
      # 8. Make Gradle executable
      # ==========================================
      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ls -la ./gradlew

      # ==========================================
      # 9. Run Unit Tests
      # Robolectric + Android SDK 36
      # JDK 21 is required
      # ==========================================
      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --no-daemon \
            --rerun-tasks
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      # ==========================================
      # 10. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      # ==========================================
      # 11. Verify APK
      # ==========================================
      - name: Verify APK Output
        shell: bash
        run: |
          set -eux

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMEX-AI-Gallery-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
